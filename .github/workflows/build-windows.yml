name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows portable package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test release metadata
        run: flutter test test/widget/settings_about_section_test.dart

      - name: Build Windows release
        run: flutter build windows --release

      - name: Prepare artifact name
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (-not $versionLine) {
            throw 'Cannot find version in pubspec.yaml.'
          }

          $version = $versionLine.Matches[0].Groups[1].Value.Trim()
          $displayVersion = ($version -split '\+')[0]
          $safeVersion = $displayVersion -replace '[^0-9A-Za-z._-]', '-'
          $artifactName = "LiteTodo-$safeVersion-windows-x64"

          "LITETODO_ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV

      - name: Package Windows release
        shell: pwsh
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }

          $artifactDir = 'build\artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $zipPath = Join-Path $artifactDir "$env:LITETODO_ARTIFACT_NAME.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force

          Get-Item $zipPath | Format-List FullName, Length

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LITETODO_ARTIFACT_NAME }}
          path: build/artifacts/${{ env.LITETODO_ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zipPath = "build\artifacts\$env:LITETODO_ARTIFACT_NAME.zip"
          gh release create $env:GITHUB_REF_NAME $zipPath `
            --title "LiteTodo $env:GITHUB_REF_NAME" `
            --notes "Windows x64 portable package. Download the ZIP, extract it, then run litetodo.exe."
